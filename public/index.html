<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guinness Finder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111'/%3E%3Cpath d='M9 12h14l-2 12H11z' fill='%23f5e6c4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="panel" aria-label="Search and results">
      <header>
        <h1>Guinness Finder</h1>
        <p class="tagline">Pubs, bars, restaurants and hotels that mention Guinness.</p>
      </header>

      <form id="geo" class="row" role="search">
        <input id="place" type="search" placeholder="Go to a town or city…" aria-label="Go to a town or city" autocomplete="off">
        <button type="submit" class="secondary">Go</button>
        <button type="button" id="locate" class="secondary" title="Use my location" aria-label="Use my location">◎</button>
      </form>

      <button id="search" class="primary" type="button" disabled>Search this area</button>
      <p id="status" class="status" role="status" aria-live="polite">Loading map…</p>

      <section aria-label="Filters">
        <div id="status-filters" class="chips" role="group" aria-label="Show venues by Guinness evidence"></div>
        <div id="category-filters" class="chips" role="group" aria-label="Venue type"></div>
        <input id="text" type="search" placeholder="Filter by name…" aria-label="Filter by name">
      </section>

      <ul id="list" class="list" aria-label="Venues"></ul>
      <p class="fineprint">“No mention found” does not prove a venue doesn’t serve Guinness. Results come from each venue’s own website and Google reviews, so always check before you travel.</p>
    </aside>

    <main class="mapwrap">
      <div id="map" role="application" aria-label="Map of venues"></div>
      <div id="fatal" class="fatal" hidden></div>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
